services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HH520_GATEWAY_TOKEN: ${HH520_GATEWAY_TOKEN:?Set a private gateway token}
      HH520_DATABASE: /state/tasks.sqlite3
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - hh520_state:/state
    restart: unless-stopped
    mem_limit: 192m
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "task_manager.worker"]
    environment:
      HH520_DATABASE: /state/tasks.sqlite3
    volumes:
      - hh520_state:/state
    restart: unless-stopped
    mem_limit: 192m
volumes:
  hh520_state:
